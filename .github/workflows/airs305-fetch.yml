name: Round 305 AIRS L3 fetch

# Fetches AIRS L3 v7 daily CO / CH4 / temperature / water vapour (research/airs305/fetch.py) one calendar year per
# job on free GitHub-hosted CPU (public repository) and publishes each year to the public HF dataset
# yasumorishima/japan-geohazard under inputs/round305_airs/.  NASA Earth science data are CC0 unless marked
# (Earthdata data use guidance).  The Earthdata token is minted from the account secrets and masked; it is never
# written to the repository or the dataset.  No earthquake data is read here.

on:
  workflow_dispatch:
    inputs:
      memo:
        description: Why this run
        required: true
      years:
        description: JSON list of calendar years
        required: true
        default: "[2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]"
      limit:
        description: Days per year (0 = all; small numbers for a smoke run, which is not published)
        required: true
        default: "0"

permissions:
  contents: read

jobs:
  year:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        year: ${{ fromJSON(inputs.years) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --quiet numpy==2.1.3 netCDF4==1.7.2 huggingface_hub==0.26.2
      - name: Earthdata token
        env:
          EDU: ${{ secrets.EARTHDATA_USERNAME }}
          EDP: ${{ secrets.EARTHDATA_PASSWORD }}
          MEMO: ${{ inputs.memo }}
        run: |
          echo "memo: $MEMO"
          tok=$(curl -sf -u "$EDU:$EDP" -X POST https://urs.earthdata.nasa.gov/api/users/find_or_create_token \
                | python -c "import json,sys; print(json.load(sys.stdin)['access_token'])")
          test -n "$tok"
          echo "::add-mask::$tok"
          echo "EDL_TOKEN=$tok" >> "$GITHUB_ENV"
      - name: Fetch
        env:
          LIMIT: ${{ inputs.limit }}
        run: python research/airs305/fetch.py ${{ matrix.year }} airs305_${{ matrix.year }}.npz
      - name: Publish and verify
        if: inputs.limit == '0'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          Y: ${{ matrix.year }}
        run: |
          python - <<'EOF'
          import hashlib, os
          from huggingface_hub import HfApi
          y = os.environ["Y"]
          src = "airs305_%s.npz" % y
          dst = "inputs/round305_airs/" + src
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_file(path_or_fileobj=src, path_in_repo=dst, repo_id="yasumorishima/japan-geohazard",
                          repo_type="dataset", commit_message="round 305 AIRS L3 %s" % y)
          info = api.get_paths_info("yasumorishima/japan-geohazard", [dst], repo_type="dataset")[0]
          n = os.path.getsize(src)
          assert info.size == n, (info.size, n)
          print("published %s %d bytes md5 %s" % (dst, n, hashlib.md5(open(src, "rb").read()).hexdigest()))
          EOF
