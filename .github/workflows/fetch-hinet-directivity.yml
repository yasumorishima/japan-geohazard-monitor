name: Fetch Hi-net Directivity Bundles

on:
  workflow_dispatch:
    inputs:
      i0:
        description: "Event plan slice start (index into scripts/hinet_dir_events.json)"
        required: true
        default: "0"
      i1:
        description: "Event plan slice end (exclusive; 0 = to the end)"
        required: true
        default: "100"
      max_sta:
        description: "Max stations per event (nearest first)"
        required: false
        default: "40"
      radius_km:
        description: "Station radius around the epicentre"
        required: false
        default: "200"
      events:
        description: "Event plan JSON (repo-relative)"
        required: false
        default: "scripts/hinet_dir_events.json"
      pre_s:
        description: "Seconds of signal before the origin time"
        required: false
        default: "30"
      post_s:
        description: "Seconds of signal after the origin time"
        required: false
        default: "180"
      env_sr:
        description: "Envelope sample rate in Hz (10 for the 210 s window, 1 for the 45 min one)"
        required: false
        default: "10"
      tag:
        description: "Artifact tag; keep distinct per round, the event index space is shared"
        required: false
        default: "dirfeat"
      memo:
        description: "Run intent (required)"
        required: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install HinetPy obspy numpy scipy
      - name: Build win32tools (catwin32 + win2sac_32)
        env:
          HINET_USER: ${{ secrets.HINET_USER }}
          HINET_PASS: ${{ secrets.HINET_PASS }}
        run: |
          PYBIN=$(command -v python3)
          "$PYBIN" -c "from HinetPy import Client; Client('${HINET_USER}', '${HINET_PASS}')._get_win32tools()" || exit 1
          if [ -f win32tools.tar.gz ]; then
            tar -xf win32tools.tar.gz && rm win32tools.tar.gz
            cd win32tools && make && mkdir -p bin && mv catwin32.src/catwin32 win2sac.src/win2sac_32 bin/ && cd ..
            echo "${{ github.workspace }}/win32tools/bin" >> $GITHUB_PATH
          else
            echo "win32tools.tar.gz not produced"; exit 1
          fi
      - name: Extract directivity bundles
        env:
          HINET_USER: ${{ secrets.HINET_USER }}
          HINET_PASS: ${{ secrets.HINET_PASS }}
          DIR_EVENTS: ${{ inputs.events }}
          DIR_I0: ${{ inputs.i0 }}
          DIR_I1: ${{ inputs.i1 }}
          DIR_MAX_STA: ${{ inputs.max_sta }}
          DIR_RADIUS_KM: ${{ inputs.radius_km }}
          DIR_PRE_S: ${{ inputs.pre_s }}
          DIR_POST_S: ${{ inputs.post_s }}
          DIR_ENV_SR: ${{ inputs.env_sr }}
          DIR_OUTTAR: hinet_${{ inputs.tag }}_${{ inputs.i0 }}_${{ inputs.i1 }}.tar.gz
        run: python scripts/fetch_hinet_dirfeat.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hinet-${{ inputs.tag }}-${{ inputs.i0 }}-${{ inputs.i1 }}
          path: hinet_${{ inputs.tag }}_${{ inputs.i0 }}_${{ inputs.i1 }}.tar.gz
          retention-days: 7
