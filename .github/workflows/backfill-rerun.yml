name: Backfill auto-rerun

# Re-runs the failed jobs of a scheduled Backfill Data run once, after
# that run has completed. The rerun used to be requested from the merge
# job of the same run, where the API refuses it (403 "This workflow is
# already running", run 43027362931). Same rules as before: scheduled
# runs only, first attempt only, only when a fetch job or light failed.

on:
  workflow_run:
    workflows: ["Backfill Data"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: >-
      github.event.workflow_run.event == 'schedule'
      && github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run failed fetch jobs once
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          failed=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/1/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name
                   | select(test("^(fetch-(modis|so2|cloud|snet|hinet|gnss)|light)$"))] | join(" ")')
          echo "failed fetch jobs: ${failed:-none}"
          if [ -z "$failed" ]; then
            echo "No fetch job or light failed; nothing to re-run."
            exit 0
          fi
          gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs"
          echo "Rerun dispatched for run $RUN_ID"
